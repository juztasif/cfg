##### ================================
##### RELOAD CONFIG
##### ================================

# Prefix + R → Reload this tmux config file
# Then show message: "Config Reloaded Successfully!"
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "    Config Reloaded Successfully!"


##### ================================
##### GENERAL SETTINGS
##### ================================

# Enable mouse support (click panes, resize, scroll)
set -g mouse on

# Set terminal type to support 256 colors inside tmux
set -g default-terminal "tmux-256color"

# Start window numbering at 1 instead of 0
set -g base-index 1


##### ================================
##### PANE NAVIGATION (Vim Style)
##### ================================

# Prefix + h → Move to left pane
bind-key h select-pane -L

# Prefix + j → Move to pane below
bind-key j select-pane -D

# Prefix + k → Move to pane above
bind-key k select-pane -U

# Prefix + l → Move to right pane
bind-key l select-pane -R


##### ================================
##### PANE SPLITTING (CUSTOM BINDS)
##### ================================

# Prefix + H → Split pane horizontally (side by side)
bind-key H split-window -h

# Prefix + V → Split pane vertically (top and bottom)
bind-key V split-window -v


##### ================================
##### STATUS BAR POSITION & STYLE
##### ================================

# Put status bar at bottom of screen
set-option -g status-position down

# Status bar colors → black background, white text
set -g status-style "bg=black,fg=white"


##### ================================
##### WINDOW LIST STYLING
##### ================================

# Inactive window style → white bold text
set -g window-status-style "bg=default,fg=white,bold"

# Active window style → green bold text
set -g window-status-current-style "bg=default,fg=green,bold"

# Window name format (inactive)
# #W = window name
set -g window-status-format " #W "

# Window name format (active)
set -g window-status-current-format " #W "
